name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd /var/www/stocksoperator
            git pull origin main
            
            # Rebuild frontend
            cd frontend
            npm install
            npm run build
            
            # Restart backend
            cd ../backend
            npm install
            pm2 restart stocksoperator-backend
