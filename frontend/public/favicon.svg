<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="soGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded pill/shield with dark slate backdrop -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />

  <!-- Outer subtle border -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#EA580C" stroke-width="2" stroke-opacity="0.4" fill="none" />

  <!-- Operator Radar / Target reticle circle in deep orange -->
  <circle cx="50" cy="50" r="34" stroke="url(#soGrad)" stroke-width="3" stroke-dasharray="7 5" opacity="0.8" />
  
  <!-- Subtle center crosshairs -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="88" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="50" x2="20" y2="50" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="50" x2="88" y2="50" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />

  <!-- Candlesticks forming Stocks Operator 'S' / Trend Pulse -->
  <!-- Left Candlestick Bullish (Deep Orange) -->
  <line x1="34" y1="36" x2="34" y2="64" stroke="#EA580C" stroke-width="2" />
  <rect x="30" y="42" width="8" height="16" rx="2" fill="url(#soGrad)" filter="url(#softGlow)" />

  <!-- Center Right Candlestick Ascending (Deep Orange) -->
  <line x1="50" y1="26" x2="50" y2="56" stroke="#EA580C" stroke-width="2" />
  <rect x="46" y="32" width="8" height="18" rx="2" fill="url(#soGrad)" />

  <!-- Right Signal Peak (Sharp White Operator Accent) -->
  <line x1="66" y1="22" x2="66" y2="52" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <rect x="62" y="26" width="8" height="14" rx="2" fill="#FFFFFF" />

  <!-- Precision Operator Signal Ray (Ascending vector across candlesticks) -->
  <path d="M22 66 L42 52 L54 58 L78 30" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Head on the Operator Signal -->
  <polygon points="78,30 68,31 75,39" fill="#FFFFFF" />
  
  <!-- Precision Operator Center Radar Dot -->
  <circle cx="78" cy="30" r="3.5" fill="#EA580C" />
</svg>